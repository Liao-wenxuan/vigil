name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 规范检查
        run: npm run lint

      - name: 单元测试
        run: npm run test

      - name: 安装浏览器
        run: npx playwright install --with-deps chromium

      - name: 端到端闭环验证
        run: npm run verify
