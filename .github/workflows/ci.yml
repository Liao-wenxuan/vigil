name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 规范检查
        run: npm run lint

      - name: 单元测试
        run: npm run test

      # 摄入路径的 DB 往返与提交次数是有上限的数字。
      # 「多了一次提交」不会让任何单测挂掉，只有线上摄入变慢才看得出来 ——
      # 所以把它做成 CI 闸门，防止批量写悄悄退化成逐条写。
      - name: 摄入往返预算
        run: npm run audit:ingest

      # 发布准备：SDK 能不能真的被装上（类型引用、依赖位置、tarball 内容）
      # ⚠️ 这一步要**先构建** —— 闸门查的是 dist 里的产物
      - name: 构建可发布的包
        run: npm run build --workspace @vigil/sdk

      - name: 发布准备检查
        run: npm run audit:publish

      # SLO 发布闸门：CI 里没有真实项目，跑到「没有 SLO → 跳过」即可 ——
      # 这一步是为了保证脚本不会烂掉
      - name: slo 闸门冒烟
        run: npm run slo:gate -- --all

      # 查询计划与租户隔离闸门**必须对着真实数据跑**：前者要把增长表
      # 放大到 2 万行才能看出扫描退化，后者要打真实写接口才能检查写语句。
      # CI 是干净环境，data/ 都没被 git 跟踪，所以先播种。
      #
      # ⚠️ 顺序不能挪到 slo:gate 之前 —— 种子里有一条「预算已烧完」的 SLO，
      #    先播种会让发布闸门按「预算耗尽」退出 1，把 CI 无端染红。
      - name: 播种演示库（闸门依赖真实数据）
        run: npm run seed:demo -- --reset

      - name: 查询计划闸门（热查询必须走索引）
        run: npm run audit:plans

      - name: 租户隔离闸门（每条语句自带租户范围）
        run: npm run audit:scope

      - name: 安装浏览器
        run: npx playwright install --with-deps chromium

      - name: 端到端闭环验证
        run: npm run verify

  # ============================================================
  # 面板端到端
  # ============================================================
  #
  # 面板是最容易「本地看着好、CI 挂掉」的一层：
  # 路由、代理注入、Element Plus 渲染、回放播放器挂载 ——
  # 任何一环变了，断言立刻能看出来。
  #
  # 跑的是**生产构建产物**（vite preview），不是 dev server ——
  # 两者不是一回事。
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VIGIL_ADMIN_TOKEN: vigil_ci_admin
      VIGIL_DB_PATH: ${{ github.workspace }}/data/ci.db
      PORT: '4318'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 构建面板与采集服务
        run: |
          npm run build --workspace @vigil/dashboard
          npm run build --workspace @vigil/collector

      - name: 安装浏览器
        run: npx playwright install --with-deps chromium

      # ⚠️ 起服务和跑测试必须在**同一个 step**。
      #    GitHub Actions 每个 `run` 块是独立 shell，块结束时
      #    里面用 `&` 起的后台进程会被杀掉。
      - name: 面板端到端验证
        run: |
          node packages/collector/dist/index.js &
          npx vite preview packages/dashboard --port 5174 --strictPort &
          node scripts/wait-for.mjs http://127.0.0.1:4318/api/health http://localhost:5174/
          node packages/dashboard/tests/verify-dashboard.mjs --url http://localhost:5174
          npm run audit:ui
