# 镜像构建只在 CI 上做。
#
# ⚠️ 绝不要在部署服务器上跑 `docker compose build`：
#    生产机只有 1.6GB 内存，vite + tsc + node-gyp 同时编译会把机器压到
#    sshd 都无响应（已经发生过一次，最后只能从控制台强制重启）。
#    服务器只需要 `docker compose pull && docker compose up -d`。
#
# 推到 GHCR 后，服务器拉的是编译好的镜像，内存占用接近零。

name: Images

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: collector
            image: ghcr.io/liao-wenxuan/vigil-collector
          - target: dashboard
            image: ghcr.io/liao-wenxuan/vigil-dashboard

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=main
            type=sha,format=short

      - name: 构建并推送 ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
