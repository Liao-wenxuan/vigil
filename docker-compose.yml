# 服务器部署：镜像由 CI 构建好推到 GHCR，这里**只拉取**。
#
#   docker compose pull && docker compose up -d
#   → 面板与接口统一入口  http://localhost:8080
#
# ⚠️ 不要在服务器上跑 `docker compose up --build`（或 build）：
#    小内存机器上编译 vite + tsc + node-gyp 会把它压死。
#    本地开发要自己构建，叠加 docker-compose.build.yml。
#
# 只有一个对外入口（dashboard 的 nginx）：
# 它同时负责静态资源、SPA 回退、/api 反代、管理 token 注入和面板登录。
# 采集服务留在容器网络里，不占宿主机端口 —— SDK 的上报地址就是
# https://<域名>/api/v1/collect。
#
# ## 为什么默认带 PostgreSQL
#
# SQLite 只能跑**单副本** —— 一个文件，多进程写会锁竞争。
# PostgreSQL 让采集服务变成**无状态**的，才能水平扩。
#
# 不想装 PG？把 collector 的 `DATABASE_URL` 注释掉，
# 它会退回 SQLite（本地开发够用，但只能单副本）。
#
# 管理 token 走环境变量注入，不写进镜像。

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vigil
      POSTGRES_USER: ${POSTGRES_USER:-vigil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 里设置 POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vigil} -d vigil']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  collector:
    # CI 构建并推送（.github/workflows/images.yml），服务器只 pull
    image: ghcr.io/liao-wenxuan/vigil-collector:main
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: '4318'
      # ⚠️ 有这个变量就用 PostgreSQL，没有就退回 SQLite（单实例开发用）。
      DATABASE_URL: postgres://${POSTGRES_USER:-vigil}:${POSTGRES_PASSWORD}@postgres:5432/vigil
      # 生产环境必须显式设置；不设置时服务会随机生成一个并打印
      VIGIL_ADMIN_TOKEN: ${VIGIL_ADMIN_TOKEN:?请在 .env 里设置 VIGIL_ADMIN_TOKEN}
      # 告警评估间隔（秒），0 关闭
      VIGIL_ALERT_INTERVAL: '60'
      # 保留策略间隔（秒），0 关闭 —— 关掉之后表只增不减
      VIGIL_RETENTION_INTERVAL: ${VIGIL_RETENTION_INTERVAL:-3600}
      LOG_LEVEL: info
    # ⚠️ 采集服务**不对外暴露端口**。
    #
    # 所有流量走 dashboard 的 nginx：一个入口、一处 TLS、一份鉴权。
    # SDK 的上报地址就是 https://<你的域名>/api/v1/collect
    # （nginx 已经把这四条上报路径反代过来）。
    #
    # 采集服务自己暴露 4318 的话，管理接口也一并在公网上了 ——
    # 那时只剩一个 token 挡着，而面板的 token 是 nginx 注入的，
    # 两套入口等于两份攻击面。
    #
    # 想在宿主机直接调接口排查，临时加回来：
    #   ports: ['127.0.0.1:4318:4318']
    expose:
      - '4318'
    healthcheck:
      # 用 /api/ready —— 它会真的连一下数据库
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4318/api/ready']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  dashboard:
    image: ghcr.io/liao-wenxuan/vigil-dashboard:main
    restart: unless-stopped
    depends_on:
      collector:
        condition: service_healthy
    environment:
      # 面板的 nginx 在**容器启动时**把它注入到 /api 请求头里（见 deploy/nginx/）。
      # 不注入的话，面板每个请求都是 401 —— 页面能打开，但全站空白。
      VIGIL_ADMIN_TOKEN: ${VIGIL_ADMIN_TOKEN:?请在 .env 里设置 VIGIL_ADMIN_TOKEN}
      # 只渲染这一个占位符。
      #
      # ⚠️ 不加过滤会把 `$host` / `$uri` 这些 nginx 变量一起抽成空串 ——
      #    envsubst 连**不带花括号**的 $VAR 也会替换。
      # ⚠️ 结尾的 $$ 是 compose 的转义（否则它会把 $' 当成插值），
      #    传给容器的是 ^VIGIL_ADMIN_TOKEN$
      #    「有没有设面板密码」由 40-vigil-auth.sh 判断，它按需生成
      #    /etc/nginx/vigil-auth.conf —— 模板里不出现密码变量。
      NGINX_ENVSUBST_FILTER: '^VIGIL_ADMIN_TOKEN$'
      # 面板登录（Basic Auth）。公网部署**必须**设，否则面板等于无密码后台：
      # 任何知道域名的人都能读走全部错误数据、会话回放和用户行为。
      VIGIL_PANEL_USER: ${VIGIL_PANEL_USER:-admin}
      VIGIL_PANEL_PASSWORD: ${VIGIL_PANEL_PASSWORD:-}
      # 只读演示令牌：匿名访客免登录即可看演示数据（前端从 /config.js 读取）。
      # 由部署时 seed-demo-member.sh 写入 .env，值是一把 org=1 / project=1 的
      # reader 成员凭据（vmk_…），后端按 RBAC 只给读权限。
      VIGIL_DEMO_MEMBER_TOKEN: ${VIGIL_DEMO_MEMBER_TOKEN:-}
    ports:
      - '8080:80'

volumes:
  postgres-data:
