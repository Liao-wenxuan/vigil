# 自动扩缩容
#
# ## 采集服务现在可以真的扩了
#
# 之前这份清单是**自相矛盾**的：
#   - Deployment 写 `replicas: 2`
#   - 但挂的是 RWO 卷（一个 Pod 独占）
#   - 而 SQLite 本身也撑不住两个进程写同一个文件
#
# 结果是：滚动更新时新 Pod 拿不到卷会卡住，HPA 拉起来的副本直接 CrashLoop。
#
# 现在采集服务**无状态**（数据在 PostgreSQL 里），`replicas: 2` + HPA 成立。
#
# ## 面板为什么要单独一个 HPA
#
# 面板是**纯静态资源 + nginx**，无状态、CPU 消耗低。
# 但它的并发全在**采集服务的查询接口**上 ——
# 面板越多副本不一定越快，得看采集服务扛不扛得住。
#
# 所以面板的 HPA 上限刻意压得比采集服务低，
# 避免面板扩容把采集服务压垮。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vigil-collector
  namespace: vigil
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vigil-collector
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      # 错误突增是尖峰 —— 扩得快
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      # 缩得慢，避免抖动
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vigil-collector
  namespace: vigil
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: vigil-collector
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vigil-dashboard
  namespace: vigil
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vigil-dashboard
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vigil-dashboard
  namespace: vigil
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: vigil-dashboard
