# 采集服务
#
# ## 为什么它现在可以多副本
#
# 换 PostgreSQL 之前，这个 Deployment 挂着一个 RWO 卷、`replicas: 2` ——
# **自相矛盾**：两个 Pod 抢同一个卷，滚动更新时新 Pod 拿不到卷会卡住，
# 而 SQLite 本身也撑不住两个进程写。
#
# 现在它**完全无状态**：
#   - 不挂任何卷（数据全在 PG 里）
#   - 只靠 `DATABASE_URL` 连接 PG
#   - 所以 `replicas: 2` + HPA 是成立的
#
# ## 探针的分工
#
#   - **存活探针** `/api/health` —— 不碰数据库。
#     数据库挂了不代表进程该被重启（重启也修不好），重启只会丢内存里的连接池。
#   - **就绪探针** `/api/ready` —— 要真的连一下数据库。
#     Pod 可能比 PG 先就绪，这时不该接收流量。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigil-collector
  namespace: vigil
  labels:
    app: vigil-collector
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vigil-collector
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: vigil-collector
      annotations:
        # 改配置后触发滚动更新（ConfigMap 变了不会自动重启 Pod）
        checksum/config: 'REPLACED_BY_CI'
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: collector
          image: vigil/collector:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4318
          env:
            - name: VIGIL_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vigil-secret
                  key: VIGIL_ADMIN_TOKEN
            # ⚠️ 有这个变量就用 PostgreSQL，没有就退回 SQLite（单实例开发用）。
            #    生产上必须设 —— 不设的话多副本会各自写一个本地文件。
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vigil-postgres
                  key: DATABASE_URL
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: vigil-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vigil-collector
  namespace: vigil
spec:
  selector:
    app: vigil-collector
  ports:
    - name: http
      port: 4318
      targetPort: http
  type: ClusterIP
