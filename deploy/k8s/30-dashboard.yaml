apiVersion: apps/v1
kind: Deployment
metadata:
  name: vigil-dashboard
  namespace: vigil
  labels:
    app: vigil-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vigil-dashboard
  template:
    metadata:
      labels:
        app: vigil-dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: dashboard
          image: vigil/dashboard:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ['ALL']
---
apiVersion: v1
kind: Service
metadata:
  name: vigil-dashboard
  namespace: vigil
spec:
  selector:
    app: vigil-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vigil
  namespace: vigil
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: '64m'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '60'
spec:
  rules:
    - host: vigil.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: vigil-collector
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vigil-dashboard
                port:
                  name: http
