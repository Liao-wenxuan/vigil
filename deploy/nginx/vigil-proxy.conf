# /api 反代到采集服务（被多个 location 复用）
#
# ## 为什么用 set + 变量，而不是直接写 http://collector:4318
#
# nginx 对**字面量** host 只在加载配置时解析一次 DNS。
# 容器重建会换 IP，之后 nginx 一直往旧 IP 打 —— 症状是
# 采集服务明明活着，面板却一直 502，直到手动 `nginx -s reload`。
#
# 写成变量后，每个请求都走 resolver 重新解析（缓存 10 秒）。
resolver 127.0.0.11 valid=10s ipv6=off;
set $vigil_collector "collector:4318";
proxy_pass http://$vigil_collector;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# 管理 token 由这一层注入。
#
# 面板的浏览器代码**不持有** token —— dev 环境是 Vite 代理注入的，
# 生产环境就是这里。好处是 token 不出现在前端 bundle，
# 也不出现在浏览器的网络面板里。
#
# ⚠️ 注入是**全局**的：管理接口因此等于「免密可调」。
#    所以模板里除上报路径外的所有 location 都必须 include
#    vigil-auth.conf —— 否则任何知道域名的人都有完整管理权限。
proxy_set_header x-vigil-admin-token "${VIGIL_ADMIN_TOKEN}";

proxy_read_timeout 30s;
