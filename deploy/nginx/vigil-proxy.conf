# /api 反代到采集服务（被多个 location 复用）
#
# ## 为什么用 set + 变量，而不是直接写 http://collector:4318
#
# nginx 对**字面量** host 只在加载配置时解析一次 DNS。
# 容器重建会换 IP，之后 nginx 一直往旧 IP 打 —— 症状是
# 采集服务明明活着，面板却一直 502，直到手动 `nginx -s reload`。
#
# 写成变量后，每个请求都走 resolver 重新解析（缓存 10 秒）。
resolver 127.0.0.11 valid=10s ipv6=off;
set $vigil_collector "collector:4318";
proxy_pass http://$vigil_collector;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# ## 令牌注入的两套语义
#
# 1. **超级管理员令牌**：只有通过了 Basic Auth（nginx 变量 `$remote_user`
#    非空）才注入。匿名请求**不会**拿到它 —— 否则「公开只读演示」会被
#    任何人拿来当全站管理员。
#    `$vigil_admin_token` 由 default.conf.template 里的 map 按 `$remote_user`
#    决定（见同目录 default.conf.template）。
#
# 2. **成员令牌**：原样透传浏览器带来的 `x-vigil-member-token`。
#    面板用它做 RBAC（只读演示走这条）；没有就不带，交给 Basic Auth。
proxy_set_header x-vigil-admin-token $vigil_admin_token;
proxy_set_header x-vigil-member-token $http_x_vigil_member_token;

proxy_read_timeout 30s;
