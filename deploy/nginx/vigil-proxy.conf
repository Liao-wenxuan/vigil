# /api 反代到采集服务（被多个 location 复用）
#
# ## 为什么用 set + 变量，而不是直接写 http://collector:4318
#
# nginx 对**字面量** host 只在加载配置时解析一次 DNS。
# 容器重建会换 IP，之后 nginx 一直往旧 IP 打 —— 症状是
# 采集服务明明活着，面板却一直 502，直到手动 `nginx -s reload`。
#
# 写成变量后，每个请求都走 resolver 重新解析（缓存 10 秒）。
resolver 127.0.0.11 valid=10s ipv6=off;
set $vigil_collector "collector:4318";
proxy_pass http://$vigil_collector;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# ## 成员令牌：原样透传给采集服务
#
# 采集服务用它做 RBAC（只读演示令牌走的就是这条）。
# ⚠️ 这里**不能**注入管理员令牌 —— 管理员令牌由 40-vigil-auth.sh
# 写进 /etc/nginx/vigil-auth.conf，只在**通过 Basic Auth 之后**
# 才由 /api 这个 location 注入。公开只读通道（named location）
# 不 include 那个文件，所以拿不到管理员令牌。
proxy_set_header x-vigil-member-token $http_x_vigil_member_token;

proxy_read_timeout 30s;
