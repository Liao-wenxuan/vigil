# 管理面板的 nginx 配置
#
# 两件事：
#   1. SPA 路由回退 —— /issues/123 直接刷新要能返回 index.html
#   2. /api 反代到采集服务（同源，面板就不用处理 CORS）

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 面板是单页应用：所有前端路由都回退到 index.html，
    # 由 vue-router 解析。直接返回 404 的话，刷新 /issues/123 会白屏。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存：否则发版后用户拿到的还是旧的资源引用
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # API 反代
    location /api/ {
        proxy_pass http://collector:4318;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
